name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          # Pin to the v2 line — `latest` works but emits a warning every
          # run, and a future GoReleaser v3 could change behaviour.
          version: '~> v2'
          args: release --clean
        env:
          # Default GITHUB_TOKEN (provided) can create the release in THIS
          # repo. HOMEBREW_TAP_GITHUB_TOKEN is a separate PAT with contents:
          # write on the j4y-w4lk3r/homebrew-pikvm repo — goreleaser uses
          # it to push Formula/pikvm.rb there.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
