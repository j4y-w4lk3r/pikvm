# GoReleaser config for `pikvm` — single static binary distribution (idea #18).
#
# Triggered by `git tag v<X.Y.Z> && git push --tags`; the release.yml GitHub
# Action then runs `goreleaser release`, which:
#
#   1. Cross-compiles the binary for macOS (amd64 + arm64) and Linux
#      (amd64 + arm64).
#   2. Archives each build as a tarball with checksums.
#   3. Builds native Linux packages (.deb / .rpm / .pkg.tar.zst — Arch).
#   4. Creates a GitHub release from the tag with a generated changelog.
#   5. Commits a Homebrew formula into github.com/j4y-w4lk3r/homebrew-pikvm
#      (see `brews:` block) so users can `brew install j4y-w4lk3r/pikvm/pikvm`.
#
# Test locally (no GitHub, no tag push) with:
#   goreleaser release --snapshot --clean
# which produces ./dist/ with all binaries + archives for inspection.

version: 2

project_name: pikvm

before:
  hooks:
    - go mod tidy

builds:
  - id: pikvm
    main: ./cmd/pikvm
    binary: pikvm
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - id: pikvm
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - ROADMAP.md
      - LICENSE*

# Native Linux packages — produces .deb (Debian/Ubuntu), .rpm (Fedora/RHEL),
# and .pkg.tar.zst (Arch). Users can `pacman -U pikvm-*.pkg.tar.zst`,
# `dpkg -i pikvm_*.deb`, or `rpm -i pikvm-*.rpm`. The AUR pikvm-bin package
# (arch/PKGBUILD) downloads our .tar.gz archives instead — keeps the GitHub
# release's primary artifact stable for non-Arch users too.
nfpms:
  - id: pikvm-pkg
    package_name: pikvm
    homepage: https://github.com/j4y-w4lk3r/pikvm
    maintainer: j4y <j4y_w4lk3r@pobox.com>
    description: "PiKVM ATX power control — terminal UI and CLI"
    license: MIT
    formats:
      - deb
      - rpm
      - archlinux  # produces .pkg.tar.zst
    bindir: /usr/bin
    section: utils
    recommends:
      - fzf
    suggests:
      - ffmpeg
      - mpv
      - chafa

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{.ShortCommit}}"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'

# Homebrew tap — goreleaser auto-commits this .rb into the configured repo.
# On first release, create the tap repo (j4y-w4lk3r/homebrew-pikvm) manually;
# goreleaser will push the Formula/pikvm.rb on every subsequent tag.
brews:
  - name: pikvm
    repository:
      owner: j4y-w4lk3r
      name: homebrew-pikvm
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/j4y-w4lk3r/pikvm
    description: "PiKVM ATX power control — terminal UI and CLI"
    license: MIT
    commit_author:
      name: j4y
      email: j4y_w4lk3r@pobox.com
    commit_msg_template: "pikvm: bump to {{ .Tag }}"
    directory: Formula
    install: |
      bin.install "pikvm"
    test: |
      assert_match "PiKVM Control", shell_output("#{bin}/pikvm --help")
    dependencies:
      - name: fzf
        type: optional
      - name: ffmpeg
        type: optional
      - name: mpv
        type: optional
      - name: chafa
        type: optional

release:
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## PiKVM v{{ .Version }}

    Pre-built static binaries for macOS (Intel + Apple Silicon) and Linux
    (x86_64 + arm64) are attached below.

    ### Install

    **macOS / Linux (Homebrew):**
    ```
    brew install j4y-w4lk3r/pikvm/pikvm
    ```

    **Arch Linux (AUR):**
    ```
    yay -S pikvm-bin       # or: paru -S pikvm-bin
    ```

    **Debian / Ubuntu:** download the `.deb` and `sudo dpkg -i pikvm_*.deb`
    **Fedora / RHEL:** download the `.rpm` and `sudo rpm -i pikvm-*.rpm`
  footer: |
    **Full changelog**: https://github.com/j4y-w4lk3r/pikvm/compare/{{ .PreviousTag }}...{{ .Tag }}
